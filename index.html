<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <title>Mon Bloc-Notes Pro</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; height: 100vh; display: flex; flex-direction: column; background: #f5f5f5; }
    
    /* Barre d'outils supérieure */
    header { background: #2c3e50; color: white; padding: 10px 20px; display: flex; justify-content: space-between; align-items: center; gap: 10px; }
    .header-tools { display: flex; gap: 10px; align-items: center; }
    .search-box, .sort-select { padding: 6px 12px; border-radius: 4px; border: none; font-size: 14px; }
    .search-box { width: 180px; }
    .sort-select { background: #ffffff; color: #2c3e50; cursor: pointer; }
    .btn-new { background: #27ae60; color: white; border: none; padding: 8px 14px; border-radius: 4px; cursor: pointer; font-weight: bold; }
    .btn-new:hover { background: #219653; }

    /* Disposition principale */
    main { display: flex; flex: 1; overflow: hidden; }

    /* Sidebar liste des fichiers */
    .sidebar { width: 320px; background: #ffffff; border-right: 1px solid #e0e0e0; overflow-y: auto; }
    .doc-item { padding: 12px 15px; border-bottom: 1px solid #f0f0f0; cursor: pointer; display: flex; justify-content: space-between; align-items: center; }
    .doc-item:hover { background: #f8f9fa; }
    .doc-item.active { background: #e8f0fe; border-left: 4px solid #1a73e8; }
    .doc-item.pinned { background: #fffde7; }
    .doc-item.pinned.active { background: #fff8e1; border-left: 4px solid #fbc02d; }
    
    .doc-info { display: flex; flex-direction: column; gap: 4px; overflow: hidden; max-width: 170px; }
    .doc-item .title { font-weight: 600; font-size: 14px; color: #333; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .doc-item .date-preview { font-size: 11px; color: #888; }

    /* Boutons d'actions sidebar */
    .actions { display: flex; gap: 4px; align-items: center; }
    .btn-action { background: transparent; border: none; font-size: 14px; cursor: pointer; padding: 4px; border-radius: 4px; transition: background 0.2s; }
    .btn-pin { color: #ccc; }
    .btn-pin.is-pinned { color: #f1c40f; }
    .btn-pin:hover { background: #fef9e7; }
    .btn-edit { color: #3498db; }
    .btn-edit:hover { background: #ebf5fb; }
    .btn-del { color: #e74c3c; font-size: 16px; }
    .btn-del:hover { background: #fadbd8; }

    /* Zone d'édition */
    .editor-container { flex: 1; display: flex; flex-direction: column; background: #ffffff; padding: 20px 40px; }
    .doc-header-details { margin-bottom: 15px; border-bottom: 1px solid #eee; padding-bottom: 10px; display: flex; justify-content: space-between; align-items: flex-end; }
    .doc-header-left { flex: 1; margin-right: 20px; }
    .doc-title-input { font-size: 24px; font-weight: bold; border: none; outline: none; margin-bottom: 5px; width: 100%; color: #2c3e50; }
    .doc-timestamp { font-size: 12px; color: #7f8c8d; font-style: italic; }
    
    /* Barre d'outils d'exportation et de copie */
    .editor-toolbar { display: flex; gap: 8px; }
    .btn-tool { background: #f8f9fa; border: 1px solid #dcdfe6; color: #606266; padding: 6px 12px; border-radius: 4px; cursor: pointer; font-size: 13px; font-weight: 500; display: flex; align-items: center; gap: 4px; transition: all 0.2s; }
    .btn-tool:hover { background: #ecf5ff; color: #409eff; border-color: #c6e2ff; }
    .btn-tool-copy:active { background: #e6a23c; color: white; }

    .doc-textarea { flex: 1; border: none; outline: none; font-size: 16px; line-height: 1.6; resize: none; font-family: 'Courier New', Courier, monospace; color: #2c3e50; }

    /* Pied de page */
    footer { background: #ecf0f1; padding: 6px 20px; font-size: 12px; color: #7f8c8d; display: flex; justify-content: space-between; border-top: 1px solid #bdc3c7; }
    .status-saved { color: #27ae60; font-weight: bold; }

    /* Style Modale */
    .modal-overlay { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0, 0, 0, 0.5); display: flex; justify-content: center; align-items: center; z-index: 1000; }
    .modal-box { background: #ffffff; padding: 24px; border-radius: 8px; width: 320px; box-shadow: 0 4px 15px rgba(0, 0, 0, 0.2); text-align: center; }
    .modal-box h3 { margin-bottom: 10px; color: #2c3e50; }
    .modal-box p { font-size: 14px; color: #666; margin-bottom: 20px; }
    .modal-actions { display: flex; justify-content: space-between; gap: 10px; }
    .btn-cancel { flex: 1; padding: 8px; border: 1px solid #ccc; background: #fff; border-radius: 4px; cursor: pointer; font-weight: 500; }
    .btn-cancel:hover { background: #f0f0f0; }
    .btn-danger { flex: 1; padding: 8px; border: none; background: #e74c3c; color: white; border-radius: 4px; cursor: pointer; font-weight: bold; }
    .btn-danger:hover { background: #c0392b; }
  </style>
</head>
<body>

  <header>
    <button class="btn-new" onclick="creerDocument()">+ Nouveau document</button>
    <div class="header-tools">
      <select id="sortSelect" class="sort-select" onchange="chargerListeDocs()">
        <option value="recent">Tri : Plus récents</option>
        <option value="alpha">Tri : Alphabetique (A-Z)</option>
      </select>
      <input type="text" class="search-box" id="searchInput" placeholder="Rechercher..." oninput="chargerListeDocs()">
    </div>
  </header>

  <main>
    <aside class="sidebar" id="docList"></aside>

    <section class="editor-container" id="editorArea" style="display:none;">
      <div class="doc-header-details">
        <div class="doc-header-left">
          <input type="text" id="docTitle" class="doc-title-input" placeholder="Titre du document..." oninput="autoSave()">
          <div id="docTimestamp" class="doc-timestamp">Dernière modification : --</div>
        </div>
        
        <!-- Barre d'outils Copie et Exportation -->
        <div class="editor-toolbar">
          <button class="btn-tool btn-tool-copy" id="btnCopy" onclick="copierTexte()" title="Copier tout le texte">📋 Copier</button>
          <button class="btn-tool" onclick="exporterDocument('txt')" title="Exporter en .txt">📥 .TXT</button>
          <button class="btn-tool" onclick="exporterDocument('md')" title="Exporter en .md">📥 .MD</button>
        </div>
      </div>
      <textarea id="docContent" class="doc-textarea" placeholder="Commencez à écrire ici..." oninput="autoSave()"></textarea>
    </section>
  </main>

  <footer>
    <div id="stats">0 Mots | 0 Caractères</div>
    <div id="saveStatus" class="status-saved">Prêt</div>
  </footer>

  <!-- Modale de Confirmation -->
  <div id="confirmModal" class="modal-overlay" style="display: none;">
    <div class="modal-box">
      <h3>Confirmation</h3>
      <p>Voulez-vous vraiment supprimer ce document ?</p>
      <div class="modal-actions">
        <button class="btn-cancel" onclick="fermerModal()">Annuler</button>
        <button class="btn-danger" id="btnConfirmDelete">Supprimer</button>
      </div>
    </div>
  </div>

  <script>
    let currentDocId = null;
    let docIdToSubmit = null;
    let saveTimeout = null;
    let localDocs = {};

    function formaterDate(isoString) {
      if (!isoString) return 'Récemment';
      const d = new Date(isoString);
      return d.toLocaleDateString('fr-FR', { day: '2-digit', month: '2-digit', year: 'numeric' }) + 
             ' à ' + d.toLocaleTimeString('fr-FR', { hour: '2-digit', minute: '2-digit' });
    }

    async function chargerListeDocs() {
      const q = document.getElementById('searchInput').value;
      const res = await fetch(`/api/docs?q=${encodeURIComponent(q)}`);
      let docs = await res.json();
      
      docs = docs.map(d => {
        const localData = localDocs[d.id] || {};
        return {
          ...d,
          isPinned: localData.isPinned || false,
          updatedAt: localData.updatedAt || new Date().toISOString()
        };
      });

      const sortMode = document.getElementById('sortSelect').value;
      docs.sort((a, b) => {
        if (a.isPinned !== b.isPinned) return b.isPinned ? 1 : -1;
        if (sortMode === 'alpha') {
          return (a.title || '').localeCompare(b.title || '');
        } else {
          return new Date(b.updatedAt) - new Date(a.updatedAt);
        }
      });

      const listHtml = docs.map(d => `
        <div class="doc-item ${d.id === currentDocId ? 'active' : ''} ${d.isPinned ? 'pinned' : ''}" onclick="ouvrirDocument(${d.id})">
          <div class="doc-info">
            <span class="title">${d.title || 'Document sans titre'}</span>
            <span class="date-preview">${formaterDate(d.updatedAt)}</span>
          </div>
          <div class="actions">
            <button class="btn-action btn-pin ${d.isPinned ? 'is-pinned' : ''}" title="${d.isPinned ? 'Désépingler' : 'Épingler'}" onclick="event.stopPropagation(); basculerEpinglage(${d.id})">⭐</button>
            <button class="btn-action btn-edit" title="Éditer" onclick="event.stopPropagation(); editerDocument(${d.id})">✏️</button>
            <button class="btn-action btn-del" title="Supprimer" onclick="event.stopPropagation(); supprimerDocument(${d.id})">×</button>
          </div>
        </div>
      `).join('');

      document.getElementById('docList').innerHTML = listHtml;
    }

    function basculerEpinglage(id) {
      if (!localDocs[id]) localDocs[id] = {};
      localDocs[id].isPinned = !localDocs[id].isPinned;
      chargerListeDocs();
    }

    async function ouvrirDocument(id) {
      currentDocId = id;
      const res = await fetch(`/api/docs/${id}`);
      const doc = await res.json();

      const lastModified = (localDocs[id] && localDocs[id].updatedAt) || new Date().toISOString();

      document.getElementById('docTitle').value = doc.title;
      document.getElementById('docContent').value = doc.content || '';
      document.getElementById('docTimestamp').innerText = `Dernière modification : ${formaterDate(lastModified)}`;
      document.getElementById('editorArea').style.display = 'flex';

      calculerStats();
      chargerListeDocs();
    }

    async function editerDocument(id) {
      await ouvrirDocument(id);
      document.getElementById('docTitle').focus();
    }

    async function creerDocument() {
      const res = await fetch('/api/docs', { method: 'POST' });
      const newDoc = await res.json();
      localDocs[newDoc.id] = { isPinned: false, updatedAt: new Date().toISOString() };
      ouvrirDocument(newDoc.id);
    }

    function autoSave() {
      calculerStats();
      document.getElementById('saveStatus').innerText = "Enregistrement...";
      document.getElementById('saveStatus').className = "";

      clearTimeout(saveTimeout);
      saveTimeout = setTimeout(async () => {
        if (!currentDocId) return;

        const title = document.getElementById('docTitle').value;
        const content = document.getElementById('docContent').value;
        const nowIso = new Date().toISOString();

        await fetch(`/api/docs/${currentDocId}`, {
          method: 'PUT',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ title, content })
        });

        if (!localDocs[currentDocId]) localDocs[currentDocId] = {};
        localDocs[currentDocId].updatedAt = nowIso;

        document.getElementById('docTimestamp').innerText = `Dernière modification : ${formaterDate(nowIso)}`;
        document.getElementById('saveStatus').innerText = "Enregistré";
        document.getElementById('saveStatus').className = "status-saved";
        chargerListeDocs();
      }, 500);
    }

    // Copier le contenu dans le presse-papier
    function copierTexte() {
      const text = document.getElementById('docContent').value;
      if (!text) return;

      navigator.clipboard.writeText(text).then(() => {
        const btn = document.getElementById('btnCopy');
        btn.innerText = "✅ Copié !";
        setTimeout(() => { btn.innerText = "📋 Copier"; }, 1500);
      });
    }

    // Exporter le fichier (.txt ou .md)
    function exporterDocument(extension) {
      const title = document.getElementById('docTitle').value || 'document';
      const content = document.getElementById('docContent').value || '';
      
      const filename = `${title.toLowerCase().replace(/[^a-z0-9]/gi, '_')}.${extension}`;
      const blob = new Blob([content], { type: 'text/plain;charset=utf-8' });
      
      const link = document.createElement('a');
      link.href = URL.createObjectURL(blob);
      link.download = filename;
      link.click();
      URL.revokeObjectURL(link.href);
    }

    function supprimerDocument(id) {
      docIdToSubmit = id;
      document.getElementById('confirmModal').style.display = 'flex';
    }

    function fermerModal() {
      docIdToSubmit = null;
      document.getElementById('confirmModal').style.display = 'none';
    }

    document.getElementById('btnConfirmDelete').onclick = async function() {
      if (!docIdToSubmit) return;
      
      await fetch(`/api/docs/${docIdToSubmit}`, { method: 'DELETE' });
      delete localDocs[docIdToSubmit];
      
      if (currentDocId === docIdToSubmit) {
        currentDocId = null;
        document.getElementById('editorArea').style.display = 'none';
      }
      
      fermerModal();
      chargerListeDocs();
    };

    function calculerStats() {
      const text = document.getElementById('docContent').value;
      const charCount = text.length;
      const wordCount = text.trim() ? text.trim().split(/\s+/).length : 0;
      document.getElementById('stats').innerText = `${wordCount} Mots | ${charCount} Caractères`;
    }

    chargerListeDocs();
  </script>
</body>
</html>
