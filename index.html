<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <title>Mon Bloc-Notes Pro</title>
  <style>
    :root {
      --bg-body: #f5f5f5;
      --bg-header: #2c3e50;
      --text-header: #ffffff;
      --bg-sidebar: #ffffff;
      --bg-sidebar-header: #f8f9fa;
      --border-color: #e0e0e0;
      --input-border: #dcdfe6;
      --text-color: #2c3e50;
      --text-muted: #888888;
      --item-hover: #f8f9fa;
      --item-active: #e8f0fe;
      --active-border: #1a73e8;
      --pinned-bg: #fffde7;
      --pinned-active: #fff8e1;
      --pinned-border: #fbc02d;
      --bg-editor: #ffffff;
      --bg-textarea: #ffffff;
      --bg-footer: #ecf0f1;
      --bg-modal: #ffffff;
      --bg-tool-btn: #f8f9fa;
      --hover-tool-btn: #ecf5ff;
    }

    /* Variables Mode Sombre */
    body.dark-mode {
      --bg-body: #18191a;
      --bg-header: #242526;
      --text-header: #e4e6eb;
      --bg-sidebar: #242526;
      --bg-sidebar-header: #1c1e21;
      --border-color: #3e4042;
      --input-border: #4e5154;
      --text-color: #e4e6eb;
      --text-muted: #b0b3b8;
      --item-hover: #3a3b3c;
      --item-active: #263951;
      --active-border: #409eff;
      --pinned-bg: #3a3520;
      --pinned-active: #4a4220;
      --pinned-border: #f1c40f;
      --bg-editor: #1c1e21;
      --bg-textarea: #242526;
      --bg-footer: #242526;
      --bg-modal: #242526;
      --bg-tool-btn: #3a3b3c;
      --hover-tool-btn: #4e5154;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; height: 100vh; display: flex; flex-direction: column; background: var(--bg-body); color: var(--text-color); transition: background 0.3s, color 0.3s; }
    
    .icon { width: 16px; height: 16px; fill: currentColor; vertical-align: middle; display: inline-block; }
    .icon-sm { width: 14px; height: 14px; }

    /* Barre d'outils supérieure */
    header { background: var(--bg-header); color: var(--text-header); padding: 12px 20px; display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid var(--border-color); }
    .header-left { display: flex; align-items: center; gap: 12px; }
    .btn-new { background: #27ae60; color: white; border: none; padding: 8px 16px; border-radius: 4px; cursor: pointer; font-weight: bold; display: flex; align-items: center; gap: 8px; font-size: 14px; transition: background 0.2s; }
    .btn-new:hover { background: #219653; }

    .btn-theme { background: transparent; border: 1px solid rgba(255,255,255,0.3); color: var(--text-header); padding: 6px 12px; border-radius: 4px; cursor: pointer; display: flex; align-items: center; gap: 6px; font-size: 13px; transition: all 0.2s; }
    .btn-theme:hover { background: rgba(255,255,255,0.1); }

    /* Disposition principale */
    main { display: flex; flex: 1; overflow: hidden; }

    /* Sidebar */
    .sidebar { width: 320px; background: var(--bg-sidebar); border-right: 1px solid var(--border-color); display: flex; flex-direction: column; }
    .sidebar-header { padding: 12px; background: var(--bg-sidebar-header); border-bottom: 1px solid var(--border-color); display: flex; flex-direction: column; gap: 8px; }
    .search-box { width: 100%; padding: 8px 12px; border-radius: 4px; border: 1px solid var(--input-border); background: var(--bg-textarea); color: var(--text-color); font-size: 13px; outline: none; }
    .search-box:focus { border-color: #409eff; }
    .sort-select { width: 100%; padding: 6px 10px; border-radius: 4px; border: 1px solid var(--input-border); background: var(--bg-textarea); color: var(--text-color); font-size: 12px; cursor: pointer; outline: none; }

    .doc-list-container { flex: 1; overflow-y: auto; }

    .doc-item { padding: 12px 15px; border-bottom: 1px solid var(--border-color); cursor: pointer; display: flex; justify-content: space-between; align-items: center; transition: background 0.2s; }
    .doc-item:hover { background: var(--item-hover); }
    .doc-item.active { background: var(--item-active); border-left: 4px solid var(--active-border); }
    .doc-item.pinned { background: var(--pinned-bg); }
    .doc-item.pinned.active { background: var(--pinned-active); border-left: 4px solid var(--pinned-border); }
    
    .doc-info { display: flex; flex-direction: column; gap: 4px; overflow: hidden; max-width: 170px; }
    .doc-item .title { font-weight: 600; font-size: 14px; color: var(--text-color); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .doc-item .date-preview { font-size: 11px; color: var(--text-muted); }

    /* Actions Sidebar */
    .actions { display: flex; gap: 4px; align-items: center; }
    .btn-action { background: transparent; border: none; cursor: pointer; padding: 4px 6px; border-radius: 4px; transition: background 0.2s, color 0.2s; display: flex; align-items: center; justify-content: center; }
    .btn-pin { color: var(--text-muted); }
    .btn-pin.is-pinned { color: #f39c12; }
    .btn-pin:hover { background: var(--item-hover); color: #f1c40f; }
    .btn-edit { color: #3498db; }
    .btn-edit:hover { background: var(--item-hover); color: #2980b9; }
    .btn-del { color: #e74c3c; }
    .btn-del:hover { background: var(--item-hover); color: #c0392b; }

    /* Éditeur */
    .editor-container { flex: 1; display: flex; flex-direction: column; background: var(--bg-editor); padding: 20px 40px; }
    .doc-header-details { margin-bottom: 15px; border-bottom: 1px solid var(--border-color); padding-bottom: 10px; display: flex; justify-content: space-between; align-items: flex-end; }
    .doc-header-left { flex: 1; margin-right: 20px; }
    .doc-title-input { font-size: 24px; font-weight: bold; border: none; background: transparent; outline: none; margin-bottom: 5px; width: 100%; color: var(--text-color); }
    .doc-timestamp { font-size: 12px; color: var(--text-muted); font-style: italic; }
    
    .editor-toolbar { display: flex; gap: 8px; flex-wrap: wrap; }
    .btn-tool { background: var(--bg-tool-btn); border: 1px solid var(--input-border); color: var(--text-color); padding: 6px 12px; border-radius: 4px; cursor: pointer; font-size: 13px; font-weight: 500; display: flex; align-items: center; gap: 6px; transition: all 0.2s; }
    .btn-tool:hover { background: var(--hover-tool-btn); color: #409eff; }
    .btn-pdf { color: #e74c3c; border-color: #fadbd8; }
    .btn-pdf:hover { background: #fef2f2; color: #c0392b; }

    .doc-textarea { flex: 1; border: 1px solid var(--border-color); background: var(--bg-textarea); border-radius: 6px; padding: 15px; outline: none; font-size: 16px; line-height: 1.6; resize: none; font-family: 'Segoe UI', Tahoma, Geneva, sans-serif; color: var(--text-color); margin-bottom: 15px; }
    .doc-textarea:focus { border-color: #409eff; }

    .editor-footer-actions { display: flex; justify-content: flex-end; gap: 10px; margin-top: 5px; }
    .btn-save { background: #1a73e8; color: white; border: none; padding: 10px 24px; border-radius: 4px; font-size: 14px; font-weight: 600; cursor: pointer; display: flex; align-items: center; gap: 8px; transition: background 0.2s; }
    .btn-save:hover { background: #1557b0; }

    /* Pied de page */
    footer { background: var(--bg-footer); padding: 6px 20px; font-size: 12px; color: var(--text-muted); display: flex; justify-content: space-between; border-top: 1px solid var(--border-color); }
    .status-saved { color: #27ae60; font-weight: bold; }

    /* Modale */
    .modal-overlay { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0, 0, 0, 0.6); display: flex; justify-content: center; align-items: center; z-index: 1000; }
    .modal-box { background: var(--bg-modal); padding: 24px; border-radius: 8px; width: 320px; box-shadow: 0 4px 15px rgba(0, 0, 0, 0.3); text-align: center; color: var(--text-color); }
    .modal-box h3 { margin-bottom: 10px; }
    .modal-box p { font-size: 14px; color: var(--text-muted); margin-bottom: 20px; }
    .modal-actions { display: flex; justify-content: space-between; gap: 10px; }
    .btn-cancel { flex: 1; padding: 8px; border: 1px solid var(--input-border); background: var(--bg-textarea); color: var(--text-color); border-radius: 4px; cursor: pointer; font-weight: 500; }
    .btn-cancel:hover { background: var(--item-hover); }
    .btn-danger { flex: 1; padding: 8px; border: none; background: #e74c3c; color: white; border-radius: 4px; cursor: pointer; font-weight: bold; }
    .btn-danger:hover { background: #c0392b; }
  </style>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js"></script>
</head>
<body>

  <!-- Sprite SVG Icones -->
  <svg style="display: none;">
    <symbol id="icon-plus" viewBox="0 0 24 24"><path d="M19 13h-6v6h-2v-6H5v-2h6V5h2v6h6v2z"/></symbol>
    <symbol id="icon-save" viewBox="0 0 24 24"><path d="M17 3H5c-1.11 0-2 .9-2 2v14c0 1.1.89 2 2 2h14c1.1 0 2-.9 2-2V7l-4-4zm-5 16c-1.66 0-3-1.34-3-3s1.34-3 3-3 3 1.34 3 3-1.34 3-3 3zm3-10H5V5h10v4z"/></symbol>
    <symbol id="icon-star-filled" viewBox="0 0 24 24"><path d="M12 17.27L18.18 21l-1.64-7.03L22 9.24l-7.19-.61L12 2 9.19 8.63 2 9.24l5.46 4.73L5.82 21z"/></symbol>
    <symbol id="icon-star-outline" viewBox="0 0 24 24"><path d="M22 9.24l-7.19-.62L12 2 9.19 8.63 2 9.24l5.46 4.73L5.82 21 12 17.27 18.18 21l-1.63-7.03L22 9.24zM12 15.4l-3.76 2.27 1-4.28-3.32-2.88 4.38-.38L12 6.1l1.71 4.04 4.38.38-3.32 2.88 1 4.28L12 15.4z"/></symbol>

    <symbol id="icon-delete" viewBox="0 0 24 24"><path d="M6 19c0 1.1.9 2 2 2h8c1.1 0 2-.9 2-2V7H6v12zM19 4h-3.5l-1-1h-5l-1 1H5v2h14V4z"/></symbol>

    <symbol id="icon-download" viewBox="0 0 24 24"><path d="M19 9h-4V3H9v6H5l7 7 7-7zM5 18v2h14v-2H5z"/></symbol>
    <symbol id="icon-pdf" viewBox="0 0 24 24"><path d="M20 2H8c-1.1 0-2 .9-2 2v12c0 1.1.9 2 2 2h12c1.1 0 2-.9 2-2V4c0-1.1-.9-2-2-2zm0 14H8V4h12v12zM4 6H2v14c0 1.1.9 2 2 2h14v-2H4V6zm12 6V9c0-.55-.45-1-1-1h-3v6h1.5v-2H15c.55 0 1-.45 1-1zm-2.5-1.5h1v1h-1v-1z"/></symbol>

    <symbol id="icon-moon" viewBox="0 0 24 24"><path d="M12 3c-4.97 0-9 4.03-9 9 0 4.97 4.03 9 9 9 3.76 0 6.95-2.31 8.27-5.6-.61.12-1.24.19-1.89.19-4.97 0-9-4.03-9-9 0-2.22.81-4.26 2.15-5.84C12.98 3.25 12.5 3 12 3z"/></symbol>
  </svg>

  <header>
    <div class="header-left">
      <button class="btn-new" onclick="creerNouveauBrouillon()">
        <svg class="icon"><use href="#icon-plus"></use></svg>
        Nouveau document
      </button>
    </div>
    <button class="btn-theme" id="btnTheme" onclick="basculerTheme()">
      <svg class="icon icon-sm" id="iconTheme"><use href="#icon-moon"></use></svg>
      <span id="labelTheme">Mode sombre</span>
    </button>
  </header>

  <main>
    <aside class="sidebar">
      <div class="sidebar-header">
        <input type="text" class="search-box" id="searchInput" placeholder="Rechercher un document..." oninput="chargerListeDocs()">
        <select id="sortSelect" class="sort-select" onchange="chargerListeDocs()">
          <option value="recent">Tri : Plus récents</option>
          <option value="alpha">Tri : Alphabetique (A-Z)</option>
        </select>
      </div>

      <div class="doc-list-container" id="docList"></div>
    </aside>

    <section class="editor-container" id="editorArea" style="display:none;">
      <div class="doc-header-details">
        <div class="doc-header-left">
          <input type="text" id="docTitle" class="doc-title-input" placeholder="Donnez un titre à votre document..." oninput="calculerStats()" title="">
          <div id="docTimestamp" class="doc-timestamp">Nouveau document (Non enregistré)</div>
        </div>
        
        <div class="editor-toolbar">
          <button class="btn-tool btn-tool-copy" id="btnCopy" onclick="copierTexte()" title="Copier tout le texte">
            <svg class="icon icon-sm" id="iconCopyState"><use href="#icon-copy"></use></svg>
            <span id="textCopyState">Copier</span>
          </button>
          <button class="btn-tool" onclick="exporterDocument('txt')" title="Exporter en .txt">
            <svg class="icon icon-sm"><use href="#icon-download"></use></svg>
            .TXT
          </button>
          <button class="btn-tool" onclick="exporterDocument('md')" title="Exporter en .md">
            <svg class="icon icon-sm"><use href="#icon-download"></use></svg>
            .MD
          </button>
          <button class="btn-tool btn-pdf" onclick="exporterPDF()" title="Exporter au format PDF">
            <svg class="icon icon-sm"><use href="#icon-pdf"></use></svg>
            .PDF
          </button>
        </div>
      </div>
      
      <textarea id="docContent" class="doc-textarea" placeholder="Rédigez votre texte ici..." oninput="calculerStats()"></textarea>
      
      <div class="editor-footer-actions">
        <button class="btn-save" onclick="enregistrerDocument()">
          <svg class="icon"><use href="#icon-save"></use></svg>
          Enregistrer le document
        </button>
      </div>
    </section>
  </main>

  <footer>
    <div id="stats">0 Mots | 0 Caractères</div>
    <div id="saveStatus" class="status-saved">Prêt</div>
  </footer>

  <!-- Modale -->
  <div id="confirmModal" class="modal-overlay" style="display: none;">
    <div class="modal-box">
      <h3>Confirmation</h3>
      <p>Voulez-vous vraiment supprimer ce document ?</p>
      <div class="modal-actions">
        <button class="btn-cancel" onclick="fermerModal()">Annuler</button>
        <button class="btn-danger" id="btnConfirmDelete">Supprimer</button>
      </div>
    </div>
  </div>

  <script>
    let currentDocId = null;
    let docIdToSubmit = null;
    let localDocs = {};

    // --- GESTION DU THEME (Clair / Sombre) ---
    function appliquerTheme(theme) {
      const iconTheme = document.querySelector('#iconTheme use');
      const labelTheme = document.getElementById('labelTheme');
      
      if (theme === 'dark') {
        document.body.classList.add('dark-mode');
        iconTheme.setAttribute('href', '#icon-sun');
        labelTheme.innerText = 'Mode clair';
      } else {
        document.body.classList.remove('dark-mode');
        iconTheme.setAttribute('href', '#icon-moon');
        labelTheme.innerText = 'Mode sombre';
      }
    }

    function basculerTheme() {
      const isDark = document.body.classList.contains('dark-mode');
      const newTheme = isDark ? 'light' : 'dark';
      localStorage.setItem('theme', newTheme);
      appliquerTheme(newTheme);
    }

    // Charger le thème au démarrage
    const savedTheme = localStorage.getItem('theme') || 'light';
    appliquerTheme(savedTheme);


    // --- FERMETURE DU DOCUMENT VIA LA TOUCHE ECHAP (ESC) ---
    document.addEventListener('keydown', function(event) {
      if (event.key === 'Escape' || event.key === 'Esc') {
        // Si la modale est ouverte, on ferme d'abord la modale
        const modal = document.getElementById('confirmModal');
        if (modal.style.display === 'flex') {
          fermerModal();
        } else if (document.getElementById('editorArea').style.display !== 'none') {
          // Sinon, on ferme le document ouvert
          fermerDocument();
        }
      }
    });

    function fermerDocument() {
      currentDocId = null;
      document.getElementById('editorArea').style.display = 'none';
      chargerListeDocs();
    }


    function formaterDate(isoString) {
      if (!isoString) return 'Récemment';
      const d = new Date(isoString);
      return d.toLocaleDateString('fr-FR', { day: '2-digit', month: '2-digit', year: 'numeric' }) + 
             ' à ' + d.toLocaleTimeString('fr-FR', { hour: '2-digit', minute: '2-digit' });
    }

    async function chargerListeDocs() {
      const q = document.getElementById('searchInput').value;
      const res = await fetch(`/api/docs?q=${encodeURIComponent(q)}`);
      let docs = await res.json();
      
      docs = docs.filter(d => d.title && d.title.trim() !== '' && d.title.toLowerCase() !== 'document sans titre');

      docs = docs.map(d => {
        const localData = localDocs[d.id] || {};
        return {
          ...d,
          isPinned: localData.isPinned || false,
          updatedAt: localData.updatedAt || new Date().toISOString()
        };
      });

      const sortMode = document.getElementById('sortSelect').value;
      docs.sort((a, b) => {
        if (a.isPinned !== b.isPinned) return b.isPinned ? 1 : -1;
        if (sortMode === 'alpha') {
          return (a.title || '').localeCompare(b.title || '');
        } else {
          return new Date(b.updatedAt) - new Date(a.updatedAt);
        }
      });

      // L'attribut title="${d.title}" est présent ici pour l'infobulle au survol
      const listHtml = docs.map(d => `
        <div class="doc-item ${d.id === currentDocId ? 'active' : ''} ${d.isPinned ? 'pinned' : ''}" onclick="ouvrirDocument(${d.id})" title="${d.title}">
          <div class="doc-info">
            <span class="title">${d.title}</span>
            <span class="date-preview">${formaterDate(d.updatedAt)}</span>
          </div>
          <div class="actions">
            <button class="btn-action btn-pin ${d.isPinned ? 'is-pinned' : ''}" title="${d.isPinned ? 'Désépingler' : 'Épingler'}" onclick="event.stopPropagation(); basculerEpinglage(${d.id})">
              <svg class="icon"><use href="${d.isPinned ? '#icon-star-filled' : '#icon-star-outline'}"></use></svg>
            </button>
            <button class="btn-action btn-edit" title="Éditer" onclick="event.stopPropagation(); editerDocument(${d.id})">
              <svg class="icon"><use href="#icon-edit"></use></svg>
            </button>
            <button class="btn-action btn-del" title="Supprimer" onclick="event.stopPropagation(); supprimerDocument(${d.id})">
              <svg class="icon"><use href="#icon-delete"></use></svg>
            </button>
          </div>
        </div>
      `).join('');

      document.getElementById('docList').innerHTML = listHtml;
    }

    function basculerEpinglage(id) {
      if (!localDocs[id]) localDocs[id] = {};
      localDocs[id].isPinned = !localDocs[id].isPinned;
      chargerListeDocs();
    }

    async function ouvrirDocument(id) {
      currentDocId = id;
      const res = await fetch(`/api/docs/${id}`);
      const doc = await res.json();

      const lastModified = (localDocs[id] && localDocs[id].updatedAt) || new Date().toISOString();

      const titleInput = document.getElementById('docTitle');
      titleInput.value = doc.title || '';
      titleInput.title = doc.title || ''; // Infobulle sur le champ de titre
      
      document.getElementById('docContent').value = doc.content || '';
      document.getElementById('docTimestamp').innerText = `Dernière modification : ${formaterDate(lastModified)}`;
      document.getElementById('editorArea').style.display = 'flex';

      calculerStats();
      chargerListeDocs();
    }

    async function editerDocument(id) {
      await ouvrirDocument(id);
      document.getElementById('docTitle').focus();
    }

    function creerNouveauBrouillon() {
      currentDocId = null;
      const titleInput = document.getElementById('docTitle');
      titleInput.value = '';
      titleInput.title = '';
      document.getElementById('docContent').value = '';
      document.getElementById('docTimestamp').innerText = 'Nouveau document (Non enregistré)';
      document.getElementById('editorArea').style.display = 'flex';
      titleInput.focus();
      calculerStats();
      chargerListeDocs();
    }

    async function enregistrerDocument() {
      const content = document.getElementById('docContent').value;
      let title = document.getElementById('docTitle').value.trim();

      if (!title) {
        if (content.trim()) {
          title = content.trim().split('\n')[0].substring(0, 30);
        } else {
          alert("Veuillez saisir un titre ou rédiger un contenu avant d'enregistrer.");
          return;
        }
      }

      document.getElementById('saveStatus').innerText = "Enregistrement en cours...";
      const nowIso = new Date().toISOString();

      if (currentDocId === null) {
        const res = await fetch('/api/docs', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ title, content })
        });
        const newDoc = await res.json();
        currentDocId = newDoc.id;
        
        await fetch(`/api/docs/${currentDocId}`, {
          method: 'PUT',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ title, content })
        });

        localDocs[currentDocId] = { isPinned: false, updatedAt: nowIso };
      } else {
        await fetch(`/api/docs/${currentDocId}`, {
          method: 'PUT',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ title, content })
        });

        if (!localDocs[currentDocId]) localDocs[currentDocId] = {};
        localDocs[currentDocId].updatedAt = nowIso;
      }

      const titleInput = document.getElementById('docTitle');
      titleInput.value = title;
      titleInput.title = title;
      
      document.getElementById('docTimestamp').innerText = `Dernière modification : ${formaterDate(nowIso)}`;
      document.getElementById('saveStatus').innerText = "Enregistré avec succès";
      document.getElementById('saveStatus').className = "status-saved";

      chargerListeDocs();
    }

    function copierTexte() {
      const text = document.getElementById('docContent').value;
      if (!text) return;

      navigator.clipboard.writeText(text).then(() => {
        const iconUse = document.querySelector('#iconCopyState use');
        const textSpan = document.getElementById('textCopyState');

        iconUse.setAttribute('href', '#icon-check');
        textSpan.innerText = "Copié !";

        setTimeout(() => {
          iconUse.setAttribute('href', '#icon-copy');
          textSpan.innerText = "Copier";
        }, 1500);
      });
    }

    function exporterDocument(extension) {
      const title = document.getElementById('docTitle').value || 'document';
      const content = document.getElementById('docContent').value || '';
      
      const filename = `${title.toLowerCase().replace(/[^a-z0-9]/gi, '_')}.${extension}`;
      const blob = new Blob([content], { type: 'text/plain;charset=utf-8' });
      
      const link = document.createElement('a');
      link.href = URL.createObjectURL(blob);
      link.download = filename;
      link.click();
      URL.revokeObjectURL(link.href);
    }

    function exporterPDF() {
      const title = document.getElementById('docTitle').value.trim() || 'Document';
      const content = document.getElementById('docContent').value;

      if (!content.trim()) {
        alert("Le document est vide, impossible d'exporter un PDF.");
        return;
      }

      const pdfContainer = document.createElement('div');
      pdfContainer.style.padding = '30px';
      pdfContainer.style.fontFamily = 'Segoe UI, Helvetica, Arial, sans-serif';
      pdfContainer.style.color = '#2c3e50';

      const h1 = document.createElement('h1');
      h1.textContent = title;
      h1.style.fontSize = '24pt';
      h1.style.borderBottom = '2px solid #2c3e50';
      h1.style.paddingBottom = '10px';
      h1.style.marginBottom = '20px';

      const p = document.createElement('div');
      p.style.fontSize = '12pt';
      p.style.lineHeight = '1.6';
      p.style.whiteSpace = 'pre-wrap';
      p.textContent = content;

      pdfContainer.appendChild(h1);
      pdfContainer.appendChild(p);

      const filename = `${title.toLowerCase().replace(/[^a-z0-9]/gi, '_')}.pdf`;

      const opt = {
        margin:       15,
        filename:     filename,
        image:        { type: 'jpeg', quality: 0.98 },
        html2canvas:  { scale: 2 },
        jsPDF:        { unit: 'mm', format: 'a4', orientation: 'portrait' }
      };

      html2pdf().set(opt).from(pdfContainer).save();
    }

    function supprimerDocument(id) {
      docIdToSubmit = id;
      document.getElementById('confirmModal').style.display = 'flex';
    }

    function fermerModal() {
      docIdToSubmit = null;
      document.getElementById('confirmModal').style.display = 'none';
    }

    document.getElementById('btnConfirmDelete').onclick = async function() {
      if (!docIdToSubmit) return;
      
      await fetch(`/api/docs/${docIdToSubmit}`, { method: 'DELETE' });
      delete localDocs[docIdToSubmit];
      
      if (currentDocId === docIdToSubmit) {
        fermerDocument();
      }
      
      fermerModal();
      chargerListeDocs();
    };

    function calculerStats() {
      const title = document.getElementById('docTitle').value;
      document.getElementById('docTitle').title = title; // mise à jour en direct du survol

      const text = document.getElementById('docContent').value;
      const charCount = text.length;
      const wordCount = text.trim() ? text.trim().split(/\s+/).length : 0;
      document.getElementById('stats').innerText = `${wordCount} Mots | ${charCount} Caractères`;
    }

    chargerListeDocs();
  </script>
</body>
</html>
