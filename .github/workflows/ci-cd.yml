name: Pipeline CI/CD Bloc-Notes Terminal

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]

jobs:
  build-and-push:
    runs-on: ubuntu-latest

    steps:
    - name: 1. Récupérer le code source
      uses: actions/checkout@v4

    - name: 2. Configurer Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '18'
        cache: 'npm'

    - name: 3. Installer les dépendances
      run: npm ci

    - name: 4. Connexion à Docker Hub
      uses: docker/login-action@v3
      with:
        username: ${{ secrets.DOCKERHUB_USERNAME }}
        password: ${{ secrets.DOCKERHUB_TOKEN }}

    - name: 5. Construire et pusher l'image Docker
      uses: docker/build-push-action@v5
      with:
        context: .
        push: true
        tags: ${{ secrets.DOCKERHUB_USERNAME }}/projet_blocnote:latest

    - name: 6. Valider les manifestes Kubernetes
      run: |
        echo "Vérification de la syntaxe des manifestes K8s..."
        kubectl apply --dry-run=client -f k8s/
