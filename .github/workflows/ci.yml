name: CI/CD - Integration et Publication Docker

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build-and-push:
    runs-on: ubuntu-latest

    steps:
      # Étape 1 : Récupération du code
      - name: Checkout du code
        uses: actions/checkout@v4

      # Étape 2 : Configuration de Docker Buildx
      - name: Configuration de Docker Buildx
        uses: docker/setup-buildx-action@v3

      # Étape 3 : Connexion à Docker Hub (utilisant les Secrets)
      - name: Connexion à Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      # Étape 4 : Build et Push de l'image Docker
      - name: Build et Push vers Docker Hub
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile
          push: true  # On active le push vers Docker Hub !
          tags: ${{ secrets.DOCKERHUB_USERNAME }}/projet_blocnote:latest
