name: CI - Integration Continue

# Déclencheur : Ce workflow s'exécute à chaque push ou Pull Request sur la branche main
on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
      # Étape 1 : Récupérer le code source depuis le dépôt GitHub
      - name: Checkout du code
        uses: actions/checkout@v4

      # Étape 2 : Configurer Buildx (l'outil de build avancé de Docker)
      - name: Configuration de Docker Buildx
        uses: docker/setup-buildx-action@v3

      # Étape 3 : Tester le build de l'image Docker
      - name: Test du build de l'image Docker
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile
          push: false # On teste seulement le build, on ne push pas encore sur un registre public
